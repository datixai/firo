<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fire Logs — FIRO</title>
  <meta name="theme-color" content="#1f7a3a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    body { font-family: Inter, sans-serif; background: #f3f4f6; color: #111827;
      padding: 20px; transition: background 0.3s, color 0.3s; overflow-x: hidden; }
    body[data-theme="dark"] { background: #0B1B2B; color: #ffffff; }

    .card { background: white; padding: 16px; border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05); transition: all 0.3s; }
    [data-theme="dark"] .card { background: #102432; color: white; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }

    .fire-entry { background: #fff5f5; border: 1px solid #fecaca; }
    [data-theme="dark"] .fire-entry { background: #3a2326; border-color: rgba(244,122,31,0.25); }

    .log-entry { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px;
      transition: transform 0.2s ease-in-out; }
    .log-entry:hover { transform: scale(1.01); }
    [data-theme="dark"] .log-entry { border-color: rgba(255,255,255,0.1); }

    .filter-bar select { outline: none; padding: 8px 12px; border-radius: 8px;
      border: 1px solid #d1d5db; background: white; color: #111827;
      transition: background 0.3s, color 0.3s, border 0.3s; }
    [data-theme="dark"] .filter-bar select { background: #1e293b; color: #fff; border: 1px solid #475569; }

    .page-container { width: 100%; max-width: 1600px; margin: 0 auto; }

    #log-content { max-height: calc(100vh - 250px); overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: #999 transparent; }
    #log-content::-webkit-scrollbar { width: 8px; }
    #log-content::-webkit-scrollbar-thumb { background-color: #aaa; border-radius: 6px; }
    #log-content::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>

<body data-theme="">
  <div class="page-container">

    <!-- Header -->
    <div class="card mb-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="/assets/logo.png" class="w-10 h-10 rounded" alt="logo" />
        <div>
          <div class="font-bold text-xl">🔥 Fire Logs</div>
          <div class="text-sm text-gray-500">Real-time event viewer</div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div id="current-time" class="text-sm font-medium text-gray-600">--</div>
        <a href="/dashboard" class="text-sm px-3 py-1 rounded bg-gray-100 hover:bg-gray-200">← Dashboard</a>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="card mb-4 filter-bar flex flex-col sm:flex-row gap-3 justify-between items-center">
      <div class="flex gap-3 w-full sm:w-auto">
        <select id="camera-filter" class="flex-1 text-sm w-56">
          <option value="">All Cameras</option>
        </select>
        <select id="status-filter" class="flex-1 text-sm w-56">
          <option value="">All Status</option>
          <option value="fire">🔥 Fire Only</option>
          <option value="safe">Safe Only</option>
        </select>
      </div>
    </div>

    <!-- Logs -->
    <div id="log-content" class="card">
      <div class="text-sm text-gray-500 italic">Loading logs…</div>
    </div>

  </div>

  <script type="module">
    import { initFirebase, fireLogsPath, ensureUser } from "/js/firebase-init.js";
    import { esc, isFireClass, isActiveFire, isResolved, getLatLon, formatTime,
             getSavedTheme, applyTheme, startClock } from "/js/common.js";
    import { collection, onSnapshot, orderBy, query }
      from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Theme sync with main dashboard + clock
    applyTheme(getSavedTheme());
    startClock(document.getElementById("current-time"));

    const container    = document.getElementById("log-content");
    const camFilter    = document.getElementById("camera-filter");
    const statusFilter = document.getElementById("status-filter");

    // ── Init (config from /api/config) ──
    let firebase;
    try {
      firebase = await initFirebase();
    } catch (err) {
      console.error(err);
      container.innerHTML = `<div class="text-sm text-red-600">Could not load configuration (see console).</div>`;
      throw err;
    }
    const { auth, db, config } = firebase;

    // Logs page is viewable by anyone with the link: reuse the logged-in
    // session if there is one, otherwise sign in anonymously.
    try { await ensureUser(auth); }
    catch (err) { console.error("[FIRO] Anonymous sign-in failed:", err); }

    const q = query(collection(db, ...fireLogsPath(config)), orderBy("timestamp_ms", "desc"));

    let allLogs = [];

    function renderLogs() {
      const selCam    = camFilter.value;
      const selStatus = statusFilter.value;
      let filtered = [...allLogs];

      if (selCam) filtered = filtered.filter(l => l.camera_location === selCam);
      if (selStatus === "fire") filtered = filtered.filter(l => isFireClass(l));
      if (selStatus === "safe") filtered = filtered.filter(l => !isFireClass(l));

      filtered.sort((a, b) => {
        const af = isActiveFire(a), bf = isActiveFire(b);
        if (af && !bf) return -1; if (!af && bf) return 1;
        return (b.timestamp_ms || 0) - (a.timestamp_ms || 0);
      });

      container.innerHTML = "";
      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-sm text-gray-500 italic">No matching logs.</div>`;
        return;
      }

      const list = document.createElement("div");
      list.className = "space-y-3";

      filtered.forEach(d => {
        const fire = isActiveFire(d);
        const pos  = getLatLon(d);
        const div  = document.createElement("div");
        div.className = `log-entry ${fire ? "fire-entry" : ""}`;
        div.innerHTML = `
          <div class="flex justify-between">
            <div>
              <strong>${fire ? "🔥 " : ""}${esc(d.camera_location || "Unknown")}</strong>
              <div class="text-xs text-gray-500">${esc(formatTime(d))}</div>
            </div>
            <div class="text-sm font-medium ${fire ? "text-red-600" : "text-green-600"}">
              ${esc(d.detection_class)}${isResolved(d) ? " (resolved)" : ""}
            </div>
          </div>
          <div class="text-xs text-gray-600 mt-2">
            Coords: ${pos ? `${pos.lat}, ${pos.lon}` : "--"} | Prob: ${esc(d.fire_probability)}
          </div>`;
        list.appendChild(div);
      });

      container.appendChild(list);
    }

    onSnapshot(q, (snapshot) => {
      allLogs = [];
      snapshot.forEach(doc => allLogs.push(doc.data()));

      const selected   = camFilter.value;
      const uniqueCams = [...new Set(allLogs.map(d => d.camera_location).filter(Boolean))].sort();
      camFilter.innerHTML = '<option value="">All Cameras</option>' +
        uniqueCams.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
      if (uniqueCams.includes(selected)) camFilter.value = selected;

      renderLogs();
    }, (err) => {
      console.error("[FIRO] Firestore listener error:", err);
      container.innerHTML = `<div class="text-sm text-red-600">Could not load logs: ${esc(err.message)}</div>`;
    });

    camFilter.addEventListener("change", renderLogs);
    statusFilter.addEventListener("change", renderLogs);
  </script>
</body>
</html>
